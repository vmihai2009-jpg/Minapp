# Publishing a release: push a tag like v1.8.2 (the tag must match Minapp/app/package.json).
# This builds both zips and attaches them to a GitHub Release; Minapp's Update button looks for them there.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check tag matches app version
        run: test "v$(node -p "require('./Minapp/app/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build zips
        run: ./Minapp/build.sh
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" docs/downloads/Minapp-*-"$GITHUB_REF_NAME".zip --title "Minapp ${GITHUB_REF_NAME#v}" --generate-notes
